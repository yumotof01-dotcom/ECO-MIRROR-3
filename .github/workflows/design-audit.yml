name: ECO MIRROR 3 phase-1 app and design audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app-shell-and-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned React/TypeScript dependencies
        run: npm ci
      - name: Validate design contract and React shell tests
        run: npm run design:check && npm test
      - name: Verify TypeScript and build production static bundle
        run: npm run build
      - name: Keep design prototype syntax valid
        run: node --check design/prototype.js
