name: Pre-UI foundation and bundled worker audit
on:
  pull_request:
    paths:
      - 'src/research/**'
      - 'src/studies/**'
      - 'public/studies/**'
      - 'scripts/research/**'
      - 'vite.research.config.ts'
      - 'package*.json'
      - '.github/workflows/pre-ui-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-foundation-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit all static resources and all research views/map frames
        run: npm run research:audit
      - name: Retain all 1000 individual case outcomes, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-1000-case-ledger
          path: .artifacts/stress-1000.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compile public app and independent worker integration library
        run: npm run build && npm run research:build
      - name: Independently validate built exports against the JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0
          node scripts/research/write-snapshot-examples.mjs
          python scripts/research/audit_snapshot_schema.py
      - name: Install isolated browser test tooling without changing app dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise real module workers, six regions, cancellation and missing-worker failure
        run: npm run research:browser
